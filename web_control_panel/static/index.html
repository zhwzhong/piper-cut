<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PIPER ROI Control</title>
    <link rel="stylesheet" href="/static/app.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="viewport">
        <div class="topbar">
          <div>
            <h1>PIPER ROI Control</h1>
            <p id="statusText">ready</p>
          </div>
          <div class="roi-fields">
            <label>X <input id="roiX" type="number" value="400" /></label>
            <label>Y <input id="roiY" type="number" value="150" /></label>
            <label>W <input id="roiW" type="number" value="400" /></label>
            <label>H <input id="roiH" type="number" value="400" /></label>
            <label>Z最小 mm <input id="targetZMin" type="number" value="99" step="0.1" /></label>
            <select id="maskMode" title="mask mode">
              <option value="rgbd" selected>rgbd</option>
              <option value="depth">depth</option>
              <option value="cardboard">cardboard</option>
            </select>
            <label class="switch"><input id="streamToggle" type="checkbox" checked /> 实时视频</label>
            <label class="switch"><input id="showRoiToggle" type="checkbox" checked /> ROI</label>
            <label class="switch"><input id="showBoxToggle" type="checkbox" checked /> 箱子</label>
            <label class="switch"><input id="showSeamToggle" type="checkbox" checked /> 中线</label>
            <select id="streamQuality" title="stream quality">
              <option value="smooth">流畅</option>
              <option value="standard" selected>标准</option>
              <option value="clear">高清</option>
              <option value="ultra">超清</option>
            </select>
          </div>
        </div>

        <div class="image-stage">
          <img id="cameraImage" alt="camera roi preview" />
          <div id="emptyImage" class="empty-image">Capture ROI</div>
        </div>

        <div class="output-grid">
          <pre id="coordsBox">No coordinates yet.</pre>
          <pre id="logBox">No command output yet.</pre>
        </div>
      </section>

      <aside class="control-panel">
        <button id="helpBtn">参数说明</button>
        <button id="runSequenceBtn" class="primary">一键执行</button>
        <button id="captureBtn" class="primary">拍摄 ROI</button>
        <button id="detectBtn">检测中线</button>
        <div class="pose-panel">
          <label>线段起点 px</label>
          <div class="line-grid">
            <input id="lineStartX" type="number" step="0.1" placeholder="start x" />
            <input id="lineStartY" type="number" step="0.1" placeholder="start y" />
          </div>
          <label>线段终点 px</label>
          <div class="line-grid">
            <input id="lineEndX" type="number" step="0.1" placeholder="end x" />
            <input id="lineEndY" type="number" step="0.1" placeholder="end y" />
          </div>
          <div class="segmented">
            <button id="selectLineBtn">校准线段</button>
            <button id="applyLineBtn">确认校准</button>
          </div>
        </div>
        <button id="poseBtn">获取 TCP 坐标</button>
        <div class="pose-panel">
          <div class="xyz-grid">
            <label>X mm <input id="targetX" type="number" step="0.1" placeholder="350" /></label>
            <label>Y mm <input id="targetY" type="number" step="0.1" placeholder="-80" /></label>
            <label>Z mm <input id="targetZ" type="number" step="0.1" placeholder="30" /></label>
          </div>
          <button id="moveXyzBtn">移动到 XYZ</button>
        </div>
        <div class="pose-panel">
          <label>点位名称 <input id="poseName" type="text" value="point_1" /></label>
          <select id="savedPoseSelect" title="saved poses">
            <option value="">暂无保存点位</option>
          </select>
          <div class="segmented">
            <button id="savePoseBtn">保存点位</button>
            <button id="movePoseBtn">回到点位</button>
          </div>
          <button id="deletePoseBtn" class="danger">清除点位</button>
        </div>
        <div class="pose-panel">
          <label class="switch"><input id="threeCutToggle" type="checkbox" /> 三线切割</label>
          <label>端部线 px <input id="sideCutPx" type="number" value="90" min="20" max="240" step="5" /></label>
          <button id="buildThreeLinesBtn">生成三线</button>
          <label>三线点位
            <select id="threeCutPointSelect" title="three cut points">
              <option value="">先生成三线</option>
            </select>
          </label>
          <button id="moveThreeCutPointBtn">到选中点</button>
          <button id="moveThreeCutAllBtn">一键 A-F</button>
        </div>
        <div class="pose-panel">
          <label class="switch"><input id="segmentToggle" type="checkbox" checked /> 启用分段</label>
          <label>分段 mm <input id="segmentMm" type="number" value="30" min="5" max="200" step="5" /></label>
          <div class="segmented">
            <button id="moveStartBtn">到起点</button>
            <button id="moveEndBtn">分段到终点</button>
          </div>
        </div>
        <div class="pose-panel">
          <button id="captureValidationBtn">拍摄标定板</button>
          <button id="validationPointBtn">选择验证点</button>
          <button id="validationErrorBtn">计算误差</button>
        </div>

        <div class="lock-row">
          <label><input id="executeToggle" type="checkbox" checked /> 允许运动</label>
          <label>运动模式
            <select id="motionMode">
              <option value="moveL">moveL 直线</option>
              <option value="moveP" selected>moveP 点到点</option>
            </select>
          </label>
          <p class="lock-note">勾选后网页自动发送确认词</p>
        </div>
        <button id="restoreBtn" class="warning">恢复 SDK</button>

        <div class="jog-panel">
          <div class="jog-settings">
            <label>步长 mm <input id="stepMm" type="number" value="1" min="0.2" max="20" step="0.2" /></label>
            <label>速度 % <input id="speedPercent" type="number" value="5" min="1" max="100" /></label>
            <label>步频 ms <input id="jogIntervalMs" type="number" value="80" min="50" max="1000" step="10" /></label>
          </div>
          <div class="jog-grid">
            <button data-axis="z" data-dir="1">Z+</button>
            <button data-axis="y" data-dir="1">↑ Y+</button>
            <button data-axis="z" data-dir="-1">Z-</button>
            <button data-axis="x" data-dir="-1">← X-</button>
            <button data-axis="y" data-dir="-1">↓ Y-</button>
            <button data-axis="x" data-dir="1">X+ →</button>
          </div>
        </div>
      </aside>
    </main>

    <script src="/static/app.js?v=20260824-point2-efdcba-point1"></script>
  </body>
</html>
